<main>
  <h1 class="page-heading" id="series-title">Sketchbook Series</h1>
  <p class="page-intro" id="series-message">
    A selection of sketches from this series will appear here.
  </p>
  <p><a href="sketchbooks.html">← Return to Sketchbooks</a></p>
</main>

<script>
  const seriesTitles = {
    "brick-arch-series": "Brick Arch Series",
    "reassembled-timber-series": "Reassembled Timber Series",
    "that-change-series": "That Change Series",
    "a-bride-for-becoming": "A Bride for Becoming",
    "totem-series": "Totem Series",
    "before-i-forget-series": "Before I Forget Series",
    "go-like-that-series": "Go Like That Series",
    "every-instant-series": "Every Instant Series",
    "remember-include": "Remember Include",
    "figure-in-landscape": "Figure in Landscape"
  };

  const params = new URLSearchParams(window.location.search);
  const seriesSlug = params.get("series");
  const seriesTitle = seriesTitles[seriesSlug] || "Sketchbook Series";

  document.getElementById("series-title").textContent = seriesTitle;
  document.getElementById("series-message").textContent =
    seriesTitle === "Sketchbook Series"
      ? "A selection of sketches from this series will appear here."
      : `A selection of sketches from the ${seriesTitle} will appear here.`;

  document.title = `${seriesTitle} | Howard Burr`;
</script>
</body>
